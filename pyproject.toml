[project]
name = "insightcrew"
version = "0.1.0"
description = "Autonomous multi-agent data-analysis system built on NVIDIA NOOA."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Harsh Agarwal" }]
dependencies = [
    "nooa>=0.0.8",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
insightcrew = "insightcrew.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insightcrew"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
